# Hyprland compositor only: monitors, input, layout, decorations.
# Desktop-shell autostart, hyper-mode binds, and overlay rules are sourced
# from ~/.config/desktop-shell/hyprland.conf — Hyprland always starts here.

################
### MONITORS ###
################

monitor=,preferred,auto,auto

# Lid open/close toggles the internal panel. The script auto-detects which
# connector is the laptop panel, so there is no hardcoded monitor name.
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh open


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    # Focus is white, not a hue: the top bar already spends its colour budget on
    # meaning (battery level, hyper mode), so the compositor stays neutral.
    col.active_border = rgba(ffffffff) rgba(ffffff80) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    extend_border_grab_area = 20
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }

    # The glow that reads as "this one is focused". Unfocused windows get a fully
    # transparent shadow so the effect marks focus rather than decorating
    # everything.
    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(ffffff40)
        color_inactive = rgba(00000000)
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gestures {
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

source = ~/.config/desktop-shell/hyprland.conf
