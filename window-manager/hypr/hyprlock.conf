# Screen lock. Matches the compositor: white focus edge, JetBrainsMono,
# Nord-ish text. Background is the desktop wallpaper (not a black fill while
# a screenshot loads). Soft blur keeps the art readable without showing
# window contents.

$font = JetBrainsMono Nerd Font
$wallpaper = ~/.config/hyprpaper/wallpapers/dbz_background.jpg

general {
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = false
}

# Parallel with password when fprintd has an enrolled print. Harmless with no
# reader; set enabled = false to hide the prompt entirely.
auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint
        present_message = Scanning...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = $wallpaper
    # Fallback only if the image fails to load
    color = rgba(18, 18, 22, 1.0)
    blur_passes = 2
    blur_size = 6
    brightness = 0.65
    contrast = 0.9
    vibrancy = 0.12
}

# Soft dark plate behind the clock + password so type stays readable on
# busy wallpaper areas, without turning the whole screen black.
shape {
    monitor =
    size = 420, 280
    color = rgba(0, 0, 0, 0.35)
    rounding = 24
    border_size = 0
    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(236, 239, 244, 1.0)
    font_size = 92
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.55)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(216, 222, 233, 0.85)
    font_size = 18
    font_family = $font
    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(216, 222, 233, 0.55)
    font_size = 14
    font_family = $font
    position = 0, -48
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(216, 222, 233, 0.7)
    font_size = 13
    font_family = $font
    position = 0, -155
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    rounding = 12
    outer_color = rgba(255, 255, 255, 0.85)
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = rgba(236, 239, 244, 1.0)
    font_family = $font
    check_color = rgba(163, 190, 140, 1.0)
    fail_color = rgba(191, 97, 106, 1.0)
    capslock_color = rgba(235, 203, 139, 1.0)
    fade_on_empty = false
    placeholder_text =
    fail_text = $FAIL
    dots_spacing = 0.35
    position = 0, -100
    halign = center
    valign = center
}
