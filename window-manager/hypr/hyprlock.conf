# Screen lock. Colours match the compositor: white focus edge, Nord type.
# `path = screenshot` blurs whatever was on screen; color is the fallback
# while that capture lands (`immediate_render`).

general {
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = false
}

background {
    monitor =
    path = screenshot
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = $TIME
    color = rgba(236, 239, 244, 1.0)
    font_size = 84
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    rounding = 12
    outer_color = rgba(255, 255, 255, 0.85)
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = rgba(236, 239, 244, 1.0)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(163, 190, 140, 1.0)
    fail_color = rgba(191, 97, 106, 1.0)
    capslock_color = rgba(235, 203, 139, 1.0)
    fade_on_empty = false
    placeholder_text =
    fail_text = $FAIL
    position = 0, -40
    halign = center
    valign = center
}
