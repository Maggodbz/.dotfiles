# Idle daemon. The only job that must not be skipped: lock before suspend.
# Started from the desktop-shell Hyprland fragment (`exec-once = hypridle`).
#
# inhibit_sleep = 3 waits until hyprlock actually holds the session lock, so
# suspend cannot race past an empty screen.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}
