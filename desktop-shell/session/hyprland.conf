# Sourced from ~/.config/hypr/hyprland.conf.
# Autostart, hyper-mode, overlays, screenshots, media keys — desktop shell.

#################
### AUTOSTART ###
#################

exec-once = hyprpaper -c ~/.config/hyprpaper/hyprpaper.conf
exec-once = ~/.config/desktop-shell/topbar-daemon.sh


###################
### KEYBINDINGS ###
###################

# Hyper mode — Super toggles the submap (shown in the top bar).
unbind = SUPER, Super_L
bind = SUPER, Super_L, exec, ~/.config/eww/widgets/hyper/toggle-mode.sh

submap = hyper

bind = SUPER, Super_L, exec, ~/.config/eww/widgets/hyper/toggle-mode.sh

# Window focus / workspaces (WM actions, bound only while the shell is in hyper)
bind = , h, movefocus, l
bind = , j, movefocus, d
bind = , k, movefocus, u
bind = , l, movefocus, r
bind = , p, focusworkspaceoncurrentmonitor, -1
bind = , n, focusworkspaceoncurrentmonitor, +1
bind = , c, killactive
bind = , 1, focusworkspaceoncurrentmonitor, 1
bind = , 2, focusworkspaceoncurrentmonitor, 2
bind = , 3, focusworkspaceoncurrentmonitor, 3
bind = , 4, focusworkspaceoncurrentmonitor, 4
bind = , 5, focusworkspaceoncurrentmonitor, 5
bind = , 6, focusworkspaceoncurrentmonitor, 6
bind = , 7, focusworkspaceoncurrentmonitor, 7
bind = , 8, focusworkspaceoncurrentmonitor, 8
bind = , 9, focusworkspaceoncurrentmonitor, 9
bind = , 0, focusworkspaceoncurrentmonitor, 10
bind = ALT, h, movewindow, l
bind = ALT, j, movewindow, d
bind = ALT, k, movewindow, u
bind = ALT, l, movewindow, r
bind = , Tab, focusmonitor, +1
bind = SHIFT, 1, movetoworkspacesilent, 1
bind = SHIFT, 2, movetoworkspacesilent, 2
bind = SHIFT, 3, movetoworkspacesilent, 3
bind = SHIFT, 4, movetoworkspacesilent, 4
bind = SHIFT, 5, movetoworkspacesilent, 5
bind = SHIFT, 6, movetoworkspacesilent, 6
bind = SHIFT, 7, movetoworkspacesilent, 7
bind = SHIFT, 8, movetoworkspacesilent, 8
bind = SHIFT, 9, movetoworkspacesilent, 9
bind = SHIFT, 0, movetoworkspacesilent, 10

# Overlays / launchers
bind = , t, exec, ~/.config/desktop-shell/toggle-overlay.sh persistent-term "wezterm start --class persistent-term"
bind = , a, exec, ~/.config/desktop-shell/toggle-overlay.sh wofi "wofi --show drun --normal-window --width 1200 --height 700 --insensitive"
bind = , f, exec, ~/.config/desktop-shell/toggle-overlay.sh yazi-overlay "wezterm start --class yazi-overlay -- bash -c 'yazi'"
bind = , m, exec, ~/.config/desktop-shell/toggle-overlay.sh netmetrics-overlay "wezterm start --class netmetrics-overlay -- ~/.config/netmetrics/run.sh"
bind = , b, exec, ~/.config/desktop-shell/toggle-overlay.sh bluetooth-overlay "wezterm start --class bluetooth-overlay -- ~/.config/bluetooth-manager/run.sh"
bind = , i, exec, ~/.config/desktop-shell/toggle-overlay.sh keybindings-overlay "wezterm start --class keybindings-overlay -- ~/.config/keybindings/run.sh"
bind = , space, exec, ~/.config/desktop-shell/toggle-overlay.sh kaya-overlay "wezterm start --class kaya-overlay -- ~/.config/kaya/run.sh"
bind = , d, exec, ~/.config/hypr/scripts/toggle-mirror.sh
bind = , ESCAPE, exec, pkill wlogout || wlogout

bind = , F1, exec, hyprshot -m output
bind = , F2, exec, hyprshot -m window -m active
bind = , F3, exec, hyprshot -m region

submap = reset

# Always-on media / brightness keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##################
### OVERLAY UI ###
##################

windowrulev2 = noinitialfocus, class:^((?!persistent-term|wofi|yazi-overlay|keybindings-overlay|netmetrics-overlay|bluetooth-overlay|kaya-overlay).)*$

# Browser screen-share indicator — park it; reveal with:
#   hyprctl dispatch togglespecialworkspace sharehud
windowrulev2 = workspace special:sharehud silent, title:^(.*is sharing (your screen|a window|a tab)( and audio)?\.)$

windowrulev2 = animation slide,class:^(wofi)$

windowrulev2 = float,class:^(yazi-overlay)$
windowrulev2 = center,class:^(yazi-overlay)$
windowrulev2 = size 1200 700,class:^(yazi-overlay)$
windowrulev2 = animation slide,class:^(yazi-overlay)$

windowrulev2 = float,class:^(keybindings-overlay)$
windowrulev2 = center,class:^(keybindings-overlay)$
windowrulev2 = size 1200 700,class:^(keybindings-overlay)$
windowrulev2 = animation slide,class:^(keybindings-overlay)$

windowrulev2 = float, class:^(persistent-term)$
windowrulev2 = center, class:^(persistent-term)$
windowrulev2 = size 1200 700, class:^(persistent-term)$
windowrulev2 = animation slide, class:^(persistent-term)$

windowrulev2 = float,class:^(netmetrics-overlay)$
windowrulev2 = center,class:^(netmetrics-overlay)$
windowrulev2 = size 1200 700,class:^(netmetrics-overlay)$
windowrulev2 = animation slide,class:^(netmetrics-overlay)$

windowrulev2 = float,class:^(bluetooth-overlay)$
windowrulev2 = center,class:^(bluetooth-overlay)$
windowrulev2 = size 1200 700,class:^(bluetooth-overlay)$
windowrulev2 = animation slide,class:^(bluetooth-overlay)$

windowrulev2 = float,class:^(kaya-overlay)$
windowrulev2 = center,class:^(kaya-overlay)$
windowrulev2 = size 1600 900,class:^(kaya-overlay)$
windowrulev2 = animation slide,class:^(kaya-overlay)$

windowrulev2 = float, class:^(eww)$
windowrulev2 = noinitialfocus, class:^(eww)$
windowrulev2 = noborder, class:^(eww)$
windowrulev2 = noshadow, class:^(eww)$
