# Wallpaper lives in the hyprpaper stow package
# (~/.config/hyprpaper/wallpapers/), not in the compositor config.
preload = ~/.config/hyprpaper/wallpapers/dbz_background.jpg

# Empty monitor field = every output, including ones that appear later when
# docking. Naming a specific monitor breaks silently as soon as that name
# changes.
wallpaper = ,~/.config/hyprpaper/wallpapers/dbz_background.jpg
