# Wallpaper lives in the hyprpaper stow package
# (~/.config/hyprpaper/wallpapers/), not in the compositor config.
#
# hyprpaper 0.8 dropped preload= / wallpaper = ,path. Empty monitor is still
# the fallback for every output, including ones that appear later when docking.

splash = false

wallpaper {
    monitor =
    path = ~/.config/hyprpaper/wallpapers/dbz_background.jpg
    fit_mode = cover
}
