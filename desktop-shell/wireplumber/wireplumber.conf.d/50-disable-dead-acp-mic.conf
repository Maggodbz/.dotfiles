# Framework 13 AMD Ryzen AI 300: BIOS exposes a phantom ACP PDM capture
# device (hw:acppdmmach). ALSA UCM names it "Digital Microphone" / Mic1 and
# prefers it over the real ALC285 internal mics. The node produces clipped
# garbage, so hide it and let Mic2 be the default.
#
# https://github.com/FrameworkComputer/SoftwareFirmwareIssueTracker/issues/166

monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.path = "hw:acppdmmach" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
